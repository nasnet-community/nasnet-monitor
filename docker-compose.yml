services:
  nasnet-monitor:
    build:
      context: .
      dockerfile: Dockerfile
    image: nasnet-monitor:latest
    ports:
      - "8080:8080"
    environment:
      HOST: 0.0.0.0
      PORT: 8080
      ENVIRONMENT: production
      DISH_ADDRESS: 192.168.100.1:9200
    restart: unless-stopped
