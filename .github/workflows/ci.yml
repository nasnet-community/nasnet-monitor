name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  backend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend

      - name: Format
        run: cargo fmt --check

      - name: Lint
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test

  binary:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v4

      - name: Build static binary with embedded SPA
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          provenance: false
          sbom: false
          build-args: |
            VERSION=ci-${{ github.sha }}
          outputs: type=local,dest=./out
          cache-from: |
            type=gha,scope=amd64
            type=gha,scope=ci-amd64
          cache-to: type=gha,mode=max,scope=ci-amd64

      - name: Stage binary
        run: |
          set -euo pipefail
          BIN=$(find out -type f -name nasnet-monitor -print -quit)
          [ -n "$BIN" ] || { echo "no binary exported" >&2; exit 1; }
          mkdir -p bin
          install -m 0755 "$BIN" bin/nasnet-monitor-linux-amd64
          ls -lh bin/nasnet-monitor-linux-amd64

      - uses: actions/upload-artifact@v7
        with:
          name: nasnet-monitor-linux-amd64
          path: bin/nasnet-monitor-linux-amd64
          if-no-files-found: error
