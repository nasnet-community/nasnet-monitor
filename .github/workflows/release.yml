name: Release Docker image

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag (e.g. dev-snapshot, v1.2.3-test)'
        required: true
        default: 'manual'

permissions:
  contents: read
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/nasnet-community/nasnet-monitor

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            suffix: amd64
          - platform: linux/arm64
            suffix: arm64
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}},suffix=-${{ matrix.suffix }}
            type=semver,pattern={{major}}.{{minor}},suffix=-${{ matrix.suffix }}
            type=raw,value=${{ inputs.tag }}-${{ matrix.suffix }},enable=${{ github.event_name == 'workflow_dispatch' }}

      - name: Resolve version
        id: version
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "value=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          provenance: false
          sbom: false
          build-args: |
            VERSION=${{ steps.version.outputs.value }}
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha,scope=${{ matrix.suffix }}
          cache-to: type=gha,mode=max,scope=${{ matrix.suffix }}

      - name: Report image size
        run: |
          set -euo pipefail
          FIRST_TAG=$(printf '%s\n' '${{ steps.meta.outputs.tags }}' | head -n1)
          SIZE_BYTES=$(docker buildx imagetools inspect "$FIRST_TAG" --raw \
            | jq '[.layers[].size] | add')
          SIZE_MB=$(awk "BEGIN { printf \"%.2f\", $SIZE_BYTES / 1048576 }")
          echo "Image $FIRST_TAG compressed size: ${SIZE_MB} MB"
          echo "- ${{ matrix.suffix }}: **${SIZE_MB} MB**" >> "$GITHUB_STEP_SUMMARY"

  manifest:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.event_name == 'push' }}
            type=raw,value=${{ inputs.tag }},enable=${{ github.event_name == 'workflow_dispatch' }}

      - name: Create multi-arch manifests
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            BASE="${{ inputs.tag }}"
          else
            BASE="${GITHUB_REF_NAME#v}"
          fi
          echo "Combining per-arch images for base: $BASE"
          while IFS= read -r TAG; do
            [ -z "$TAG" ] && continue
            echo "  -> $TAG"
            docker buildx imagetools create --tag "$TAG" \
              "${{ env.IMAGE }}:${BASE}-amd64" \
              "${{ env.IMAGE }}:${BASE}-arm64"
          done <<< "${{ steps.meta.outputs.tags }}"

  package:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: read
    steps:
      - name: Install skopeo
        run: |
          sudo apt-get update
          sudo apt-get install -y skopeo

      - name: Log in to ${{ env.REGISTRY }}
        run: skopeo login "${{ env.REGISTRY }}" -u "${{ github.actor }}" -p "${{ secrets.GITHUB_TOKEN }}"

      - name: Package per-arch container image tars
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          for SUFFIX in amd64 arm64; do
            REF="${IMAGE}:${VERSION}-${SUFFIX}"
            OUT="nasnet-monitor-${VERSION}-${SUFFIX}.tar"
            echo "-> ${REF} => dist/${OUT}.gz"
            skopeo copy "docker://${REF}" "docker-archive:dist/${OUT}:nasnet-monitor:${VERSION}-${SUFFIX}"
            gzip -9 "dist/${OUT}"
            ( cd dist && sha256sum "${OUT}.gz" > "${OUT}.gz.sha256" )
          done

      - name: Attach tars to the GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body: |
            `docker pull ghcr.io/nasnet-community/nasnet-monitor:${{ github.ref_name }}`

            Container image tars (`docker load < file.tar.gz`; for RouterOS container import, `gunzip` first):
            - `nasnet-monitor-*-amd64.tar.gz` (x86_64)
            - `nasnet-monitor-*-arm64.tar.gz` (arm64 — MikroTik hAP ax2)
          files: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
